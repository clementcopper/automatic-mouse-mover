name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4

    # The app reads its version from Info.plist, so that and the tag are the only two
    # places; a mismatch ships a build that reports the wrong number, so refuse it.
    - name: Check the version matches the tag
      run: |
        version="${GITHUB_REF_NAME#v}"
        grep -q "<string>${version}</string>" appInfo/Info.plist

    - name: Test
      run: make test

    # The Makefile builds for macosx13.0, so an artefact built on macos-15 still runs
    # on Ventura.
    - name: Build universal bundle
      run: make build

    - name: Check both architectures are present
      run: |
        archs=$(lipo -archs ./bin/amm.app/Contents/MacOS/amm)
        echo "$archs"
        [[ "$archs" == *x86_64* && "$archs" == *arm64* ]] || exit 1
        codesign --verify --verbose=2 ./bin/amm.app

    # ditto rather than zip: it preserves the ad-hoc signature.
    - name: Package
      run: |
        version="${GITHUB_REF_NAME#v}"
        ditto -c -k --keepParent ./bin/amm.app "amm-${version}-universal.zip"
        ls -l "amm-${version}-universal.zip"

    # gh is preinstalled on the runners, so no third-party action is needed.
    - name: Attach to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version="${GITHUB_REF_NAME#v}"
        gh release upload "$GITHUB_REF_NAME" "amm-${version}-universal.zip" --clobber \
          || gh release create "$GITHUB_REF_NAME" "amm-${version}-universal.zip" \
               --title "$GITHUB_REF_NAME" --generate-notes
